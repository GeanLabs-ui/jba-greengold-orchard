name: Deploy production

on:
  # Manual release only; branch merges must not trigger a production deployment.
  workflow_dispatch:
    inputs:
      confirm_cutover:
        description: 'Enter APPROVE_JBA_CUTOVER after backups and bindings are verified'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_cutover == 'APPROVE_JBA_CUTOVER' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure runner Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify production is an exact staging promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin staging
          git diff --exit-code origin/staging HEAD
          staging_sha="$(git rev-parse origin/staging)"
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-staging.yml --branch staging --commit "$staging_sha" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo 'The exact promoted staging commit must have a successful staging deployment.' >&2
            exit 1
          fi
      - run: npm ci
      - name: Verify production database and service bindings
        run: npm run deploy:verify -- --env=production
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          APP_URL: ${{ vars.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run check
      - name: Reject destructive database migrations
        run: npm run db:check-migrations
      - name: Back up production and prove restoration before migrations
        run: node scripts/production-data-safety.mjs backup
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Save encrypted production recovery backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-recovery-backup-${{ github.run_id }}
          path: test-results/production-safety/
          retention-days: 90
          if-no-files-found: error
      - name: Apply verified additive production migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
      - name: Verify existing production data after migrations
        run: node scripts/production-data-safety.mjs verify
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Deploy production API
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          environment: production
          secrets: |
            TURNSTILE_SECRET_KEY
            GOOGLE_CLIENT_ID
          command: deploy --env production --keep-vars
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build Pages application
        run: npm run build:web
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Deploy production Pages branch
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=jba-greengold-orchard --branch=main
      - name: Smoke test frontend and database readiness
        run: |
          curl --fail --retry 5 --retry-delay 5 --silent --show-error "${{ vars.APP_URL }}/" > /dev/null
          health="$(curl --fail --retry 5 --retry-delay 5 --silent --show-error "${{ vars.APP_URL }}/api/v1/health")"
          ready="$(curl --fail --retry 5 --retry-delay 5 --silent --show-error "${{ vars.APP_URL }}/api/v1/ready")"
          node -e 'const body = JSON.parse(process.argv[1]); if (body.status !== "ok") process.exit(1)' "$health"
          node -e 'const body = JSON.parse(process.argv[1]); if (body.status !== "ready") process.exit(1)' "$ready"
      - name: Verify existing production data after deployment
        run: node scripts/production-data-safety.mjs verify
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Save data preservation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-data-verification-${{ github.run_id }}
          path: test-results/production-safety/*.json
          if-no-files-found: ignore
          retention-days: 90
