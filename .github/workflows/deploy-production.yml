name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify production is an exact staging promotion
        run: |
          git fetch origin staging
          git diff --exit-code origin/staging HEAD
      - run: npm ci
      - name: Verify production database and service bindings
        run: npm run deploy:verify -- --env=production
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          APP_URL: ${{ vars.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run check
      - name: Reject destructive database migrations
        run: npm run db:check-migrations
      - name: Apply production database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      - name: Deploy production API
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          environment: production
          secrets: |
            TURNSTILE_SECRET_KEY
            GOOGLE_CLIENT_ID
          command: deploy --env production
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Build Pages application
        run: npm run build:web
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Deploy production Pages branch
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --config apps/web/wrangler.jsonc --project-name=jba-greengold-orchard --branch=main
      - name: Smoke test frontend and database readiness
        run: |
          curl --fail --retry 5 --retry-delay 5 --silent --show-error "${{ vars.APP_URL }}/" > /dev/null
          health="$(curl --fail --retry 5 --retry-delay 5 --silent --show-error "${{ vars.APP_URL }}/api/v1/health")"
          ready="$(curl --fail --retry 5 --retry-delay 5 --silent --show-error "${{ vars.APP_URL }}/api/v1/ready")"
          node -e 'const body = JSON.parse(process.argv[1]); if (body.status !== "ok") process.exit(1)' "$health"
          node -e 'const body = JSON.parse(process.argv[1]); if (body.status !== "ready") process.exit(1)' "$ready"
