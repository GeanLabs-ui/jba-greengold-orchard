name: Continuous integration

on:
  pull_request:
    branches: [staging, main]
  push:
    branches-ignore: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mango_farm
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:15432/mango_farm
    steps:
      - name: Configure runner Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Reject destructive database migrations
        run: npm run db:check-migrations
      - name: Validate migrations and idempotency
        run: npm run db:migrate && npm run db:migrate
      - name: Verify authenticated account and invitation database flows
        run: npx vitest run apps/api/src/account-isolation.integration.test.ts apps/api/src/staff-invitations.integration.test.ts
        env:
          AUTH_DATABASE_TEST: '1'
          STAFF_INVITATION_DATABASE_TEST: '1'
      - name: Verify staff access and financial corrections in an isolated database
        run: |
          node --input-type=module -e "import postgres from 'postgres'; const sql=postgres(process.env.DATABASE_URL); try { await sql.unsafe('CREATE DATABASE staff_access_test'); } finally { await sql.end(); }"
          DATABASE_URL=postgresql://postgres:postgres@localhost:15432/staff_access_test npm run db:migrate
          DATABASE_URL=postgresql://postgres:postgres@localhost:15432/staff_access_test STAFF_ACCESS_DATABASE_TEST=1 npx vitest run apps/api/src/staff-access.integration.test.ts
      - name: Verify new operational fields against PostgreSQL
        run: node scripts/verify-release-field-storage.mjs
      - name: Verify Main Activities migration preserves existing records
        run: node scripts/test-main-activities-migration.mjs
      - name: Audit all dependencies
        run: npm run audit:dependencies
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate staging Worker bundle
        run: npx wrangler deploy --config apps/api/wrangler.jsonc --env staging --dry-run
