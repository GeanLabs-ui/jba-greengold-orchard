name: Continuous integration

on:
  pull_request:
    branches: [staging, main]
  push:
    branches-ignore: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mango_farm_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mango_farm_test
    steps:
      - name: Configure runner Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Reject destructive database migrations
        run: npm run db:check-migrations
      - name: Validate migrations and idempotency
        run: npm run db:migrate && npm run db:migrate
      - name: Verify Main Activities migration preserves existing records
        run: node scripts/test-main-activities-migration.mjs
      - name: Audit all dependencies
        run: npm audit --audit-level=low
      - name: Validate staging Worker bundle
        run: npx wrangler deploy --config apps/api/wrangler.jsonc --env staging --dry-run
