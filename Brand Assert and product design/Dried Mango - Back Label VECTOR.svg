<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="106mm" height="156mm" viewBox="0 0 106 156" version="1.1">
  <title>JBA GreenGold Orchard Dried Mango Back Label - Vector</title>
  <desc>Pure vector back label with 3mm bleed, 100mm x 150mm trim, and 4mm safe area. No bitmap images are embedded.</desc>
  <defs>
    <linearGradient id="paperBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="0.52" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#efe6d4"/>
    </linearGradient>
    <linearGradient id="greenBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#073d17"/>
      <stop offset="0.58" stop-color="#00501d"/>
      <stop offset="1" stop-color="#063814"/>
    </linearGradient>
    <symbol id="brandMarkBack" viewBox="0 0 48 46">
      <path d="M24 2 C12 13 8 26 16 42 C17 31 22 23 32 17 C31 11 28 6 24 2Z" fill="#005321"/>
      <path d="M35 9 C42 21 39 34 25 43 C27 31 26 22 21 16 C26 15 31 12 35 9Z" fill="#3a2508"/>
      <path d="M16 38 C19 27 25 19 35 15" fill="none" stroke="#fffdf2" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M23 42 C28 35 35 31 44 29" fill="none" stroke="#fffdf2" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M27 43 C33 38 39 36 45 35" fill="none" stroke="#0b376f" stroke-width="2" stroke-linecap="round"/>
      <circle cx="22" cy="24" r="5" fill="#fffdf2"/>
      <path d="M19 29 C15 32 13 36 13 40" fill="none" stroke="#fffdf2" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="benefitIcon" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="7.2" fill="#fffdf2" stroke="#d8a400" stroke-width="0.9"/>
      <path d="M4.2 8.2 C5.5 4.2 9.2 3.5 12 4.4 C11.2 8.5 8.2 11 4.2 10.8 C5 9.8 6.2 8.5 8 7.6" fill="#0b5a25"/>
    </symbol>
    <symbol id="mangoSeed" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="7.2" fill="#fffdf2" stroke="#d8a400" stroke-width="0.9"/>
      <ellipse cx="8" cy="8.3" rx="3.6" ry="4.8" fill="#5a2c0b"/>
      <path d="M5.8 7 C7.3 5.6 8.8 4.9 10.7 4.9" stroke="#8d5b19" stroke-width=".5" fill="none"/>
    </symbol>
    <symbol id="leafLine" viewBox="0 0 34 28">
      <path d="M2 21 C10 8 21 3 32 2 C27 16 17 24 2 21Z" fill="none" stroke="#b08a50" stroke-width=".45"/>
      <path d="M3 21 C11 15 20 9 31 3" fill="none" stroke="#b08a50" stroke-width=".35"/>
      <path d="M10 16 C9 12 8 9 6 6 M16 12 C15 8 14 5 12 3 M22 8 C22 5 21 3 20 1" fill="none" stroke="#b08a50" stroke-width=".3"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="106" height="156" rx="3" fill="url(#paperBack)"/>
  <use href="#leafLine" x="2" y="17" width="28" height="23" opacity=".65"/>
  <use href="#leafLine" x="78" y="19" width="30" height="25" opacity=".65" transform="rotate(15 93 31)"/>

  <g transform="translate(27 11)">
    <use href="#brandMarkBack" x="16" y="0" width="24" height="23"/>
    <text x="28" y="36" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="8.3" font-weight="800" fill="#075226">JBA Green<tspan fill="#d79400">Gold</tspan></text>
    <text x="28" y="42" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="4.3" font-weight="700" letter-spacing="3" fill="#2b1608">ORCHARD</text>
    <line x1="5" y1="45" x2="51" y2="45" stroke="#2b1608" stroke-width="0.35"/>
    <text x="28" y="50" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="2.5" font-weight="600" letter-spacing=".25" fill="#442810">GOOD FOOD, SUSTAINABLE TOMORROW</text>
  </g>

  <text x="53" y="61" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="3" font-weight="600" fill="#6a3d16">Our dried mangoes are made from carefully selected</text>
  <text x="53" y="66" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="3" font-weight="600" fill="#6a3d16">premium mangoes, dried to preserve golden flavor,</text>
  <text x="53" y="71" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="3" font-weight="600" fill="#6a3d16">sunshine sweetness, and chewy perfection.</text>

  <g opacity=".58" stroke="#9f7c44" stroke-width=".32" fill="none">
    <path d="M2 79 C11 74 20 76 29 82 C41 72 55 74 68 82 C78 75 88 76 104 80"/>
    <path d="M4 84 C17 80 30 81 43 84 C58 78 72 79 101 85"/>
    <path d="M15 79 C14 74 17 70 22 70 C26 70 29 74 29 79"/>
    <path d="M70 80 C69 75 72 72 76 72 C80 72 83 75 84 80"/>
    <path d="M87 81 C88 76 92 73 96 74 C99 74 102 77 103 81"/>
  </g>

  <path d="M0 80 C20 84 39 83 58 79 C76 75 91 75 106 72 V156 H0 Z" fill="url(#greenBack)"/>
  <path d="M0 79 C20 83 39 82 58 78 C76 74 91 74 106 71" fill="none" stroke="#f6b100" stroke-width="2"/>
  <path d="M0 77 C20 81 39 80 58 76 C76 72 91 72 106 69" fill="none" stroke="#fff8e7" stroke-width=".55"/>
  <path d="M65 82 L64 139" stroke="#d1cfb2" stroke-width=".25"/>

  <g transform="translate(8 88)" font-family="Montserrat, Arial, sans-serif" fill="#fff8e7">
    <use href="#benefitIcon" x="0" y="0" width="10" height="10"/>
    <text x="14" y="3.5" font-size="2.8" font-weight="900">100% NATURAL</text>
    <text x="14" y="7" font-size="1.7">No artificial colors or preservatives</text>
    <use href="#mangoSeed" x="0" y="14" width="10" height="10"/>
    <text x="14" y="17.5" font-size="2.8" font-weight="900">PREMIUM QUALITY</text>
    <text x="14" y="21" font-size="1.7">Selected fruit, dried for freshness</text>
    <use href="#benefitIcon" x="0" y="28" width="10" height="10"/>
    <text x="14" y="31.5" font-size="2.8" font-weight="900">HEALTHY CHOICE</text>
    <text x="14" y="35" font-size="1.7">A naturally sweet tropical snack</text>
    <text x="0" y="45" font-size="3" font-weight="900">INGREDIENTS</text>
    <text x="0" y="49" font-size="2">Mango, sugar, citric acid.</text>
    <text x="0" y="56" font-size="3" font-weight="900">STORAGE</text>
    <text x="0" y="60" font-size="2">Store in a cool dry place.</text>
    <text x="0" y="64" font-size="2">Reseal after opening.</text>
  </g>

  <g transform="translate(68 86)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="31" height="47" rx="1.8" fill="#fffdf7" stroke="#d7d0c2" stroke-width=".35"/>
    <text x="2" y="5" font-size="4.1" font-weight="900" fill="#111">NUTRITION FACTS</text>
    <text x="2" y="8.8" font-size="1.55" fill="#111">Serving size 40g</text>
    <line x1="2" y1="11" x2="29" y2="11" stroke="#111" stroke-width=".6"/>
    <text x="2" y="14" font-size="1.55" fill="#111">Amount per serving</text>
    <text x="2" y="18" font-size="2.3" font-weight="800" fill="#111">Calories</text>
    <text x="27" y="18" text-anchor="end" font-size="2.3" font-weight="800" fill="#111">130</text>
    <line x1="2" y1="20" x2="29" y2="20" stroke="#111" stroke-width=".25"/>
    <text x="29" y="23" text-anchor="end" font-size="1.5" font-weight="700" fill="#111">% Daily Value*</text>
    <text x="2" y="26" font-size="1.65" fill="#111">Total Fat 0g</text><text x="28" y="26" text-anchor="end" font-size="1.65" fill="#111">0%</text>
    <line x1="2" y1="27.5" x2="29" y2="27.5" stroke="#111" stroke-width=".18"/>
    <text x="2" y="30.5" font-size="1.65" fill="#111">Sodium 10mg</text><text x="28" y="30.5" text-anchor="end" font-size="1.65" fill="#111">0%</text>
    <line x1="2" y1="32" x2="29" y2="32" stroke="#111" stroke-width=".18"/>
    <text x="2" y="35" font-size="1.65" fill="#111">Total Carbohydrate 32g</text><text x="28" y="35" text-anchor="end" font-size="1.65" fill="#111">12%</text>
    <line x1="2" y1="36.5" x2="29" y2="36.5" stroke="#111" stroke-width=".18"/>
    <text x="4" y="39.5" font-size="1.55" fill="#111">Total Sugars 25g</text>
    <text x="2" y="42.5" font-size="1.65" fill="#111">Protein 1g</text>
    <line x1="2" y1="44" x2="29" y2="44" stroke="#111" stroke-width=".25"/>
    <text x="2" y="46" font-size="1.05" fill="#111">*Percent values are approximate.</text>
  </g>

  <g transform="translate(8 138)" fill="#fff8e7" font-family="Montserrat, Arial, sans-serif">
    <circle cx="5" cy="4" r="3.2" fill="none" stroke="#fff8e7" stroke-width=".7"/>
    <path d="M3 4 L5 2 L7 4 M5 2 V6" stroke="#fff8e7" stroke-width=".55" fill="none" stroke-linecap="round"/>
    <text x="0" y="10" font-size="1.7">Recycle</text>
    <path d="M23 1 H27 V8 H23 Z M24 0 H26" stroke="#fff8e7" stroke-width=".6" fill="none"/>
    <text x="18" y="10" font-size="1.7">Reseal</text>
    <circle cx="45" cy="4" r="3.4" fill="none" stroke="#fff8e7" stroke-width=".7"/>
    <path d="M43 4 C44 2 46 2 47 3 C46 6 44 7 42 6" fill="#fff8e7"/>
    <text x="39" y="10" font-size="1.7">Natural</text>
  </g>

  <g transform="translate(68 136)" font-family="Montserrat, Arial, sans-serif" fill="#fff8e7">
    <text x="0" y="0" font-size="2.2" font-weight="800">Packed for:</text>
    <text x="0" y="4" font-size="1.9">JBA GreenGold Orchard</text>
    <text x="0" y="8" font-size="1.9">Product of Africa</text>
  </g>
  <g transform="translate(84 142)">
    <rect x="0" y="0" width="16" height="10" fill="#fffdf7" stroke="#111" stroke-width=".25"/>
    <g fill="#111">
      <rect x="1" y="1" width=".4" height="8"/><rect x="2" y="1" width=".8" height="8"/><rect x="3.4" y="1" width=".35" height="8"/>
      <rect x="4.4" y="1" width="1" height="8"/><rect x="6" y="1" width=".45" height="8"/><rect x="7" y="1" width=".8" height="8"/>
      <rect x="8.5" y="1" width=".35" height="8"/><rect x="9.5" y="1" width="1.1" height="8"/><rect x="11.2" y="1" width=".45" height="8"/>
      <rect x="12.1" y="1" width=".7" height="8"/><rect x="13.5" y="1" width=".35" height="8"/><rect x="14.4" y="1" width=".65" height="8"/>
    </g>
    <text x="8" y="9.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="1.2" fill="#111">4 15678 25000 6</text>
  </g>
  <text x="72" y="151" font-family="Montserrat, Arial, sans-serif" font-size="2.2" font-weight="900" fill="#f6bd00">PRODUCT OF AFRICA</text>

  <rect id="trim-line-100x150mm" x="3" y="3" width="100" height="150" rx="2.5" fill="none" stroke="#00a2ff" stroke-width="0.18" stroke-dasharray="2 1.4"/>
  <rect id="safe-area" x="7" y="7" width="92" height="142" rx="1.5" fill="none" stroke="#ec008c" stroke-width="0.14" stroke-dasharray="1.3 1.2"/>
</svg>
